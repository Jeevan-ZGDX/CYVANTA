version: '3.8'

services:
  fastapi:
    build: .
    container_name: neon_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://neon_user:neon_pass@postgres:5432/neon_db
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: neon_postgres
    restart: always
    environment:
      - POSTGRES_USER=neon_user
      - POSTGRES_PASSWORD=neon_pass
      - POSTGRES_DB=neon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: neon_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
